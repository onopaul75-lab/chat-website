
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKER'S LAB — Secure Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #020403;
      color: #00ff66;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    /* AUTH */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at center, #073d20 0%, #020403 55%);
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      border: 1px solid #00ff66;
      background: rgba(0, 15, 7, 0.96);
      box-shadow: 0 0 30px rgba(0, 255, 102, .2);
      padding: 30px;
      border-radius: 10px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 12px #00ff66;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #58b878;
      margin-bottom: 25px;
      font-size: 13px;
    }

    .auth-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: #010b05;
      border: 1px solid #075d2a;
      border-radius: 5px;
      color: #00ff66;
      outline: none;
    }

    .auth-box input:focus {
      border-color: #00ff66;
      box-shadow: 0 0 8px rgba(0,255,102,.2);
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .auth-buttons button {
      flex: 1;
      padding: 13px;
      border: 1px solid #00ff66;
      background: #003d19;
      color: #00ff66;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .auth-buttons button:hover {
      background: #00ff66;
      color: #001b09;
    }

    #authMessage {
      text-align: center;
      margin-top: 15px;
      color: #ff6969;
      font-size: 13px;
      min-height: 18px;
    }

    /* APP */

    #app {
      display: none;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #075d2a;
      background: #010a05;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ff66;
    }

    .status {
      color: #00ff66;
      font-size: 12px;
    }

    .logout {
      margin-left: 15px;
      border: 1px solid #ff4040;
      color: #ff6666;
      background: transparent;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      height: calc(100vh - 65px);
    }

    /* USERS */

    .users-panel,
    .profile-panel {
      background: #010a05;
      border-right: 1px solid #075d2a;
      overflow-y: auto;
    }

    .profile-panel {
      border-right: none;
      border-left: 1px solid #075d2a;
      padding: 20px;
    }

    .panel-title {
      padding: 18px;
      border-bottom: 1px solid #075d2a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .search {
      padding: 12px;
    }

    .search input {
      width: 100%;
      padding: 10px;
      background: #020d06;
      border: 1px solid #075d2a;
      color: #00ff66;
      outline: none;
      border-radius: 4px;
    }

    .user {
      padding: 13px 15px;
      border-bottom: 1px solid #063719;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user:hover,
    .user.active {
      background: #032712;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border: 1px solid #00ff66;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background: #002b12;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 14px;
      color: #d1ffe0;
    }

    .user-status {
      font-size: 11px;
      color: #4c9f68;
      margin-top: 3px;
    }

    .online {
      color: #00ff66;
    }

    /* CHAT */

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background:
        linear-gradient(rgba(0, 255, 102, .015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, .015) 1px, transparent 1px),
        #020603;
      background-size: 25px 25px;
    }

    .chat-header {
      min-height: 65px;
      padding: 12px 18px;
      border-bottom: 1px solid #075d2a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-name {
      font-weight: bold;
      color: #d7ffe5;
    }

    .chat-header-status {
      font-size: 11px;
      color: #4c9f68;
      margin-top: 3px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .empty {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #287e48;
      text-align: center;
      padding: 20px;
    }

    .message-row {
      display: flex;
      margin-bottom: 12px;
    }

    .message-row.me {
      justify-content: flex-end;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      border: 1px solid #075d2a;
      background: #03160a;
      border-radius: 8px;
      color: #baffcc;
      font-size: 14px;
      line-height: 1.45;
    }

    .message-row.me .message {
      background: #003719;
      border-color: #00a844;
    }

    .message-time {
      font-size: 9px;
      color: #4c9f68;
      margin-top: 5px;
      text-align: right;
    }

    .composer {
      border-top: 1px solid #075d2a;
      padding: 12px;
      display: flex;
      gap: 10px;
      background: #010a05;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      background: #020d06;
      border: 1px solid #075d2a;
      color: #00ff66;
      outline: none;
      border-radius: 5px;
    }

    .composer button {
      padding: 0 20px;
      background: #003d19;
      border: 1px solid #00ff66;
      color: #00ff66;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .composer button:hover {
      background: #00ff66;
      color: #001b09;
    }

    /* PROFILE */

    .profile-avatar {
      width: 90px;
      height: 90px;
      border: 2px solid #00ff66;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px auto;
      font-size: 30px;
      font-weight: bold;
      background: #002b12;
      box-shadow: 0 0 20px rgba(0,255,102,.15);
    }

    .profile-name {
      text-align: center;
      font-size: 18px;
      color: #d7ffe5;
      margin-bottom: 5px;
    }

    .profile-status {
      text-align: center;
      font-size: 12px;
      color: #00ff66;
    }

    .profile-info {
      margin-top: 25px;
      border-top: 1px solid #075d2a;
    }

    .info-row {
      padding: 13px 0;
      border-bottom: 1px solid #063719;
      font-size: 12px;
    }

    .info-label {
      color: #4c9f68;
      display: block;
      margin-bottom: 4px;
    }

    .info-value {
      color: #baffcc;
      word-break: break-word;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 210px 1fr;
      }

      .profile-panel {
        display: none;
      }
    }

    @media (max-width: 650px) {
      #app {
        height: 100dvh;
      }

      .topbar {
        height: 58px;
        padding: 0 10px;
      }

      .brand {
        font-size: 16px;
      }

      .status {
        display: none;
      }

      .layout {
        height: calc(100dvh - 58px);
        grid-template-columns: 1fr;
      }

      .users-panel {
        display: none;
      }

      .chat-header {
        min-height: 58px;
      }

      #messages {
        padding: 12px;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- AUTHENTICATION SCREEN -->

  <section id="authScreen">
    <div class="auth-box">

      <div class="logo">HACKER'S LAB</div>
      <div class="subtitle">SECURE COMMUNICATION TERMINAL</div>

      <input
        id="username"
        type="text"
        placeholder="Username — for registration"
        autocomplete="username"
      >

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <div class="auth-buttons">
        <button id="registerBtn">REGISTER</button>
        <button id="loginBtn">LOGIN</button>
      </div>

      <div id="authMessage"></div>

    </div>
  </section>


  <!-- MAIN APPLICATION -->

  <section id="app">

    <header class="topbar">
      <div class="brand">HACKER'S LAB</div>

      <div>
        <span class="status">● SECURE NETWORK ONLINE</span>
        <button class="logout" id="logoutBtn">LOGOUT</button>
      </div>
    </header>

    <div class="layout">

      <!-- USERS -->

      <aside class="users-panel">

        <div class="panel-title">USERS / OPERATORS</div>

        <div class="search">
          <input
            id="searchInput"
            type="text"
            placeholder="Search users..."
          >
        </div>

        <div id="usersList"></div>

      </aside>


      <!-- CHAT -->

      <main class="chat">

        <div class="chat-header">

          <div class="avatar" id="chatAvatar">?</div>

          <div>
            <div class="chat-header-name" id="chatName">
              Select a user
            </div>

            <div class="chat-header-status" id="chatStatus">
              No conversation selected
            </div>
          </div>

        </div>


        <div id="messages">

          <div class="empty">
            Select a user to start a secure conversation.
          </div>

        </div>


        <form class="composer" id="messageForm">

          <input
            id="messageInput"
            type="text"
            placeholder="Type secure message..."
            autocomplete="off"
          >

          <button type="submit">SEND</button>

        </form>

      </main>


      <!-- PROFILE -->

      <aside class="profile-panel">

        <div class="panel-title">OPERATOR PROFILE</div>

        <div class="profile-avatar" id="profileAvatar">?</div>

        <div class="profile-name" id="profileName">
          No user selected
        </div>

        <div class="profile-status" id="profileStatus">
          —
        </div>

        <div class="profile-info">

          <div class="info-row">
            <span class="info-label">EMAIL</span>
            <span class="info-value" id="profileEmail">—</span>
          </div>

          <div class="info-row">
            <span class="info-label">USER ID</span>
            <span class="info-value" id="profileUid">—</span>
          </div>

          <div class="info-row">
            <span class="info-label">NETWORK</span>
            <span class="info-value">ENCRYPTED</span>
          </div>

          <div class="info-row">
            <span class="info-label">STATUS</span>
            <span class="info-value">SECURE</span>
          </div>

        </div>

      </aside>

    </div>

  </section>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      getDoc,
      getDocs,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIGURATION
       ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyA936HZkzU5eMJHU-Gb9MnNTZSYavv4IAw",
      authDomain: "hackers-lab-47457.firebaseapp.com",
      projectId: "hackers-lab-47457",
      storageBucket: "hackers-lab-47457.firebasestorage.app",
      messagingSenderId: "1088433002797",
      appId: "1:1088433002797:web:bec368a1ab9cef791edba4",
      measurementId: "G-RVBB0L8H68"
    };


    /* =========================
       INITIALIZE FIREBASE
       ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================
       APPLICATION STATE
       ========================= */

    let currentUser = null;

    let selectedUser = null;

    let unsubscribeMessages = null;

    let allUsers = [];


    /* =========================
       ELEMENTS
       ========================= */

    const authScreen = document.getElementById("authScreen");
    const appScreen = document.getElementById("app");

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const authMessage = document.getElementById("authMessage");

    const usersList = document.getElementById("usersList");
    const searchInput = document.getElementById("searchInput");

    const messagesBox = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");

    const chatAvatar = document.getElementById("chatAvatar");
    const chatName = document.getElementById("chatName");
    const chatStatus = document.getElementById("chatStatus");

    const profileAvatar = document.getElementById("profileAvatar");
    const profileName = document.getElementById("profileName");
    const profileStatus = document.getElementById("profileStatus");
    const profileEmail = document.getElementById("profileEmail");
    const profileUid = document.getElementById("profileUid");


    /* =========================
       HELPER FUNCTIONS
       ========================= */

    function showAuthMessage(message, success = false) {
      authMessage.textContent = message;
      authMessage.style.color = success ? "#00ff66" : "#ff6969";
    }


    function getInitial(name) {
      if (!name) return "?";
      return name.charAt(0).toUpperCase();
    }


    function chatIdFor(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }


    function formatTime(timestamp) {

      if (!timestamp) return "";

      try {

        const date = timestamp.toDate();

        return date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

      } catch (error) {

        return "";

      }
    }


    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    /* =========================
       REGISTER
       ========================= */

    registerBtn.addEventListener("click", async () => {

      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!username || !email || !password) {

        showAuthMessage(
          "Enter username, email and password."
        );

        return;
      }

      if (password.length < 6) {

        showAuthMessage(
          "Password must contain at least 6 characters."
        );

        return;
      }

      try {

        showAuthMessage(
          "Creating secure account...",
          true
        );

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = result.user;

        await setDoc(
          doc(db, "users", user.uid),
          {
            uid: user.uid,
            email: user.email,
            username: username,
            online: true,
            createdAt: serverTimestamp(),
            lastSeen: serverTimestamp()
          }
        );

        showAuthMessage(
          "Account created successfully.",
          true
        );

      } catch (error) {

        console.error(error);

        showAuthMessage(
          friendlyAuthError(error)
        );

      }

    });


    /* =========================
       LOGIN
       ========================= */

    loginBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {

        showAuthMessage(
          "Enter your email and password."
        );

        return;
      }

      try {

        showAuthMessage(
          "Authenticating...",
          true
        );

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        showAuthMessage(
          friendlyAuthError(error)
        );

      }

    });


    /* =========================
       AUTH ERROR MESSAGES
       ========================= */

    function friendlyAuthError(error) {

      switch (error.code) {

        case "auth/email-already-in-use":
          return "That email is already registered.";

        case "auth/invalid-email":
          return "Invalid email address.";

        case "auth/weak-password":
          return "Password is too weak.";

        case "auth/invalid-credential":
          return "Incorrect email or password.";

        case "auth/user-not-found":
          return "Account not found.";

        case "auth/wrong-password":
          return "Incorrect password.";

        case "auth/too-many-requests":
          return "Too many attempts. Try again later.";

        default:
          return error.message || "Authentication failed.";

      }

    }


    /* =========================
       AUTH STATE
       ========================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (user) {

          currentUser = user;

          authScreen.style.display = "none";

          appScreen.style.display = "block";

          try {

            await updateDoc(
              doc(db, "users", user.uid),
              {
                online: true,
                lastSeen: serverTimestamp()
              }
            );

          } catch (error) {

            console.log(
              "User status update:",
              error.message
            );

          }

          await loadUsers();

        } else {

          currentUser = null;

          authScreen.style.display = "flex";

          appScreen.style.display = "none";

          selectedUser = null;

          if (unsubscribeMessages) {

            unsubscribeMessages();

            unsubscribeMessages = null;

          }

        }

      }
    );


    /* =========================
       LOAD USERS
       ========================= */

    async function loadUsers() {

      usersList.innerHTML = "";

      try {

        const snapshot =
          await getDocs(
            collection(db, "users")
          );

        allUsers = [];

        snapshot.forEach((document) => {

          const data = document.data();

          if (
            currentUser &&
            data.uid !== currentUser.uid
          ) {

            allUsers.push(data);

          }

        });

        renderUsers(allUsers);

      } catch (error) {

        console.error(error);

        usersList.innerHTML = `
          <div style="
            padding:20px;
            color:#ff6969;
            font-size:12px;
          ">
            Unable to load users.<br><br>
            Check Firestore rules.
          </div>
        `;

      }

    }


    /* =========================
       RENDER USERS
       ========================= */

    function renderUsers(users) {

      usersList.innerHTML = "";

      if (users.length === 0) {

        usersList.innerHTML = `
          <div style="
            padding:20px;
            color:#287e48;
            font-size:12px;
          ">
            No other users registered yet.
          </div>
        `;

        return;
      }

      users.forEach((user) => {

        const element =
          document.createElement("div");

        element.className = "user";

        if (
          selectedUser &&
          selectedUser.uid === user.uid
        ) {

          element.classList.add("active");

        }

        element.innerHTML = `

          <div class="avatar">
            ${escapeHtml(getInitial(user.username))}
          </div>

          <div>

            <div class="user-name">
              ${escapeHtml(
                user.username || "Unknown"
              )}
            </div>

            <div class="user-status ${
              user.online ? "online" : ""
            }">

              ${user.online ? "● ONLINE" : "○ OFFLINE"}

            </div>

          </div>

        `;

        element.addEventListener(
          "click",
          () => selectUser(user)
        );

        usersList.appendChild(element);

      });

    }


    /* =========================
       SEARCH
       ========================= */

    searchInput.addEventListener(
      "input",
      () => {

        const search =
          searchInput.value
            .trim()
            .toLowerCase();

        const filtered =
          allUsers.filter((user) => {

            const name =
              (user.username || "")
                .toLowerCase();

            const email =
              (user.email || "")
                .toLowerCase();

            return (
              name.includes(search) ||
              email.includes(search)
            );

          });

        renderUsers(filtered);

      }
    );


    /* =========================
       SELECT USER
       ========================= */

    async function selectUser(user) {

      selectedUser = user;

      chatName.textContent =
        user.username || "Unknown";

      chatAvatar.textContent =
        getInitial(user.username);

      chatStatus.textContent =
        user.online
          ? "● ONLINE"
          : "○ OFFLINE";

      profileAvatar.textContent =
        getInitial(user.username);

      profileName.textContent =
        user.username || "Unknown";

      profileStatus.textContent =
        user.online
          ? "● ONLINE"
          : "○ OFFLINE";

      profileEmail.textContent =
        user.email || "—";

      profileUid.textContent =
        user.uid || "—";

      renderUsers(
        allUsers.filter(
          item =>
            item.username
        )
      );

      loadMessages(user);

    }


    /* =========================
       LOAD REAL-TIME MESSAGES
       ========================= */

    function loadMessages(user) {

      if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages = null;

      }

      messagesBox.innerHTML = `
        <div class="empty">
          Loading secure conversation...
        </div>
      `;

      const id =
        chatIdFor(
          currentUser.uid,
          user.uid
        );

      const messagesRef =
        collection(
          db,
          "chats",
          id,
          "messages"
        );

      const messagesQuery =
        query(
          messagesRef,
          orderBy("createdAt", "asc")
        );

      unsubscribeMessages =
        onSnapshot(
          messagesQuery,
          (snapshot) => {

            messagesBox.innerHTML = "";

            if (snapshot.empty) {

              messagesBox.innerHTML = `
                <div class="empty">
                  No messages yet.<br>
                  Start the conversation.
                </div>
              `;

              return;

            }

            snapshot.forEach(
              (messageDocument) => {

                const message =
                  messageDocument.data();

                const isMe =
                  message.senderId ===
                  currentUser.uid;

                const row =
                  document.createElement("div");

                row.className =
                  "message-row" +
                  (isMe ? " me" : "");

                row.innerHTML = `

                  <div class="message">

                    <div>
                      ${escapeHtml(
                        message.text || ""
                      )}
                    </div>

                    <div class="message-time">
                      ${formatTime(
                        message.createdAt
                      )}
                    </div>

                  </div>

                `;

                messagesBox.appendChild(row);

              }
            );

            messagesBox.scrollTop =
              messagesBox.scrollHeight;

          },
          (error) => {

            console.error(error);

            messagesBox.innerHTML = `
              <div class="empty">
                Unable to load messages.<br><br>
                Check Firestore security rules.
              </div>
            `;

          }
        );

    }


    /* =========================
       SEND MESSAGE
       ========================= */

    messageForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        if (!currentUser) return;

        if (!selectedUser) {

          alert(
            "Select a user first."
          );

          return;

        }

        const text =
          messageInput.value.trim();

        if (!text) return;

        messageInput.disabled = true;

        const id =
          chatIdFor(
            currentUser.uid,
            selectedUser.uid
          );

        try {

          await addDoc(
            collection(
              db,
              "chats",
              id,
              "messages"
            ),
            {
              text: text,
              senderId: currentUser.uid,
              receiverId: selectedUser.uid,
              createdAt: serverTimestamp()
            }
          );

          messageInput.value = "";

        } catch (error) {

          console.error(error);

          alert(
            "Message could not be sent. Check Firestore rules."
          );

        }

        messageInput.disabled = false;

        messageInput.focus();

      }
    );


    /* =========================
       LOGOUT
       ========================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          if (currentUser) {

            try {

              await updateDoc(
                doc(
                  db,
                  "users",
                  currentUser.uid
                ),
                {
                  online: false,
                  lastSeen: serverTimestamp()
                }
              );

            } catch (error) {

              console.log(
                "Could not update offline status."
              );

            }

          }

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =========================
       ENTER KEY LOGIN
       ========================= */

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          loginBtn.click();

        }

      }
    );

  </script>

</body>
</html>
